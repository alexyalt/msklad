name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Проверка наличия Gradle-проекта
        id: project
        run: |
          if [ -f gradlew ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "Gradle-проект ещё не добавлен, сборка пропущена."; fi

      - name: Установка JDK 17
        if: steps.project.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настройка Gradle
        if: steps.project.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Сборка debug APK
        if: steps.project.outputs.present == 'true'
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Загрузка APK
        if: steps.project.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: msklad-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Публикация APK в релиз latest
        if: steps.project.outputs.present == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk msklad-debug.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest msklad-debug.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Последняя сборка (debug APK)" \
            --notes "Автоматическая сборка из коммита ${GITHUB_SHA::7}. Файл msklad-debug.apk можно скачать и установить на Android."
